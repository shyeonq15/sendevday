<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교사 개발자의 날 2026</title>
<meta name="description" content="누구나 == 개발자. 매달 마지막 화요일 저녁, 교사 개발자의 날.">
<link rel="stylesheet" href="shared/fonts.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap">
<link rel="stylesheet" href="shared/base.css">
<link rel="stylesheet" href="shared/core.css">
<script src="shared/data.js"></script>
<script src="shared/kit.js"></script>
<script src="shared/core.js"></script>
<style>
/* 시안 X · 키치 코드 기호: 검정 바탕에 픽셀 코딩 기호, 2D 프롬이, 카오모지 리본 테이프, 아래 색 블록 타이포 */
:root{--sky:#4FC3FF}
#poster{background:var(--ink);color:#fff;--intro-bg:var(--ink);--intro-fg:#fff;--intro-accent:var(--lime)}
.wide body{background:var(--ink)}
.lay{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto auto;grid-template-areas:"top" "blocks" "art" "tapes" "foot"}
.wide .lay{grid-template-columns:1fr 1.15fr;grid-template-rows:auto auto 1fr auto;grid-template-areas:"top top" "blocks blocks" "art tapes" "foot foot"}
.top{grid-area:top;display:flex;justify-content:space-between;align-items:center;padding:calc(var(--p)*26) calc(var(--p)*36) calc(var(--p)*18);font:700 calc(var(--p)*12)/1 var(--mono);letter-spacing:.1em}
.top b{color:var(--lime);font-weight:800}
.top .c{color:var(--lilac)}

/* 기호 + 프롬이 */
.art{grid-area:art;position:relative;min-height:calc(var(--p)*300)}
.sym{position:absolute;cursor:pointer;will-change:translate,transform;transition:translate .5s cubic-bezier(.2,.8,.3,1)}
.sym svg{width:100%;height:auto}
.prom{position:absolute;left:50%;top:50%;width:calc(var(--p)*230);transform:translate(-50%,-46%) rotate(-6deg);cursor:pointer;z-index:2}
.wide .prom{width:calc(var(--p)*210)}
.prom .bw{animation:float 2.6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(calc(var(--p)*-10)) rotate(3deg)}}
.say{position:absolute;left:calc(50% + var(--p)*60);top:calc(50% - var(--p)*150);z-index:3;background:var(--lime);color:var(--ink);font:800 calc(var(--p)*15)/1 var(--mono);
  padding:calc(var(--p)*10) calc(var(--p)*14);border-radius:calc(var(--p)*4);transform:rotate(5deg);white-space:nowrap;box-shadow:calc(var(--p)*4) calc(var(--p)*4) 0 var(--lilac)}
.lede{position:absolute;left:calc(var(--p)*36);bottom:calc(var(--p)*16);z-index:3;font:700 calc(var(--p)*14)/1.6 var(--mono);color:rgba(255,255,255,.85)}
.lede b{color:var(--lime)}

/* 리본 테이프 */
.tapes{grid-area:tapes;display:grid;gap:calc(var(--p)*12);padding:calc(var(--p)*10) 0 calc(var(--p)*26)}
.wide .tapes{align-content:center;padding:calc(var(--p)*10) calc(var(--p)*24) calc(var(--p)*10) 0}
.tape{position:relative;display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:calc(var(--p)*14);margin:0 calc(var(--p)*-14);
  padding:calc(var(--p)*12) calc(var(--p)*44);border:0;color:var(--ink);font-family:var(--sans);text-align:left;cursor:pointer;transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.wide .tape{margin:0;padding:calc(var(--p)*12) calc(var(--p)*22)}
.tape:nth-child(1){background:var(--lime);transform:rotate(-2.5deg)}
.tape:nth-child(2){background:var(--lilac);transform:rotate(1.8deg)}
.tape:nth-child(3){background:#fff;transform:rotate(-1.2deg)}
.tape:hover{transform:rotate(0) scale(1.03)}
.tape:focus-visible{outline:calc(var(--p)*3) solid var(--coral);outline-offset:calc(var(--p)*3)}
.tape::before,.tape::after{content:"";position:absolute;top:0;bottom:0;width:calc(var(--p)*10);background:inherit;
  -webkit-mask:linear-gradient(135deg,transparent 50%,#000 50%) 0 0/calc(var(--p)*10) calc(var(--p)*10);mask:linear-gradient(135deg,transparent 50%,#000 50%) 0 0/calc(var(--p)*10) calc(var(--p)*10)}
.tape .no{font:800 calc(var(--p)*13)/1 var(--mono);background:var(--ink);color:#fff;padding:calc(var(--p)*7) calc(var(--p)*8)}
.tape .d{font:900 calc(var(--p)*34)/1 var(--sans);letter-spacing:-.055em;white-space:nowrap}
.tape .d small{font-size:calc(var(--p)*15);margin-left:calc(var(--p)*3);letter-spacing:-.02em}
.tape .t{min-width:0;border-left:calc(var(--p)*2) solid var(--ink);padding-left:calc(var(--p)*12)}
.tape .t b{display:block;font:850 calc(var(--p)*15.5)/1.25 var(--sans);letter-spacing:-.03em}
.tape .t span{display:block;margin-top:calc(var(--p)*3);font:700 calc(var(--p)*12)/1.3 var(--mono)}
.tape .k{font:800 calc(var(--p)*19)/1 var(--mono);white-space:nowrap}
.tape .nx{position:absolute;right:calc(var(--p)*30);top:calc(var(--p)*-12);background:var(--coral);color:#fff;font:800 calc(var(--p)*11)/1 var(--mono);padding:calc(var(--p)*6) calc(var(--p)*9);transform:rotate(4deg)}

/* 색 블록 타이포 */
.blocks{grid-area:blocks;position:relative;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:calc(var(--p)*112)}
.wide .blocks{grid-template-columns:1.1fr 1.5fr 1.1fr .7fr .7fr;grid-auto-rows:calc(var(--p)*118)}
.bk{display:flex;align-items:center;padding:0 calc(var(--p)*18);font:900 calc(var(--p)*86)/1 var(--sans);letter-spacing:-.07em;color:var(--ink);overflow:hidden;white-space:nowrap}
.wide .bk{font-size:calc(var(--p)*80)}
.b1{grid-column:span 2;background:var(--lilac)}
.b2{grid-column:span 2;background:var(--lime)}
.b3{grid-column:span 2;background:#fff}
.wide .b1,.wide .b2,.wide .b3{grid-column:span 1}
.yr{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;border:calc(var(--p)*2) solid #fff;border-width:0}
.yr i{display:grid;place-items:center;font:500 calc(var(--p)*44)/1 var(--sans);font-style:normal;color:#fff;border:1px solid rgba(255,255,255,.4)}
.yr i:nth-child(1),.yr i:nth-child(4){background:#fff;color:var(--ink)}
.qr{background:var(--sky);display:grid;place-items:center;text-decoration:none}
.qr span{display:block;height:80%;aspect-ratio:1;background:#fff;padding:6%}
.qr img{display:block;width:100%;height:100%}
.label{position:absolute;z-index:4;right:3%;top:calc(var(--p)*-30);transform:rotate(-7deg);background:var(--sky);color:var(--ink);font:900 calc(var(--p)*24)/1 var(--mono);
  padding:calc(var(--p)*10) calc(var(--p)*18);letter-spacing:-.02em;box-shadow:calc(var(--p)*5) calc(var(--p)*5) 0 var(--ink);white-space:nowrap}
.wide .label{right:2%;top:calc(var(--p)*-34)}
.foot{grid-area:foot;display:flex;justify-content:space-between;gap:calc(var(--p)*12);padding:calc(var(--p)*14) calc(var(--p)*36) calc(var(--p)*18);font:600 calc(var(--p)*11)/1.4 var(--sans);color:rgba(255,255,255,.75)}
.foot b{color:#fff;font-weight:800}
.foot .pending{margin-left:calc(var(--p)*4)}

/* 제목 블록을 맨 위로 */
.blocks{grid-auto-rows:calc(var(--p)*124)}
.bk{font-size:calc(var(--p)*100)}
.wide .blocks{grid-auto-rows:calc(var(--p)*108)}
.wide .bk{font-size:calc(var(--p)*84)}
.label{top:auto;bottom:calc(var(--p)*-26);right:4%}
.wide .label{top:auto;bottom:calc(var(--p)*-26);right:auto;left:43%}
.art{min-height:calc(var(--p)*330)}
.tapes{padding-top:calc(var(--p)*4)}
.wide .tapes{padding-top:calc(var(--p)*24)}
.prom{top:54%}
.qr span{height:auto;aspect-ratio:auto;padding:calc(var(--p)*6)}
.qr img{width:calc(var(--p)*96);height:calc(var(--p)*96)}
.wide .qr img{width:calc(var(--p)*82);height:calc(var(--p)*82)}
html:not(.wide) .label{right:auto;left:6%;bottom:calc(var(--p)*-28)}

/* 테이프 내용 크게 + 장소 배지 */
.tape{padding-top:calc(var(--p)*14);padding-bottom:calc(var(--p)*14)}
.tape .t b{font-size:calc(var(--p)*19)}
.tape .wh{display:flex !important;flex-wrap:wrap;align-items:center;gap:calc(var(--p)*6) calc(var(--p)*10);margin-top:calc(var(--p)*7) !important;font:inherit !important}
.tape .pb{font-style:normal;font:900 calc(var(--p)*13.5)/1 var(--sans);padding:calc(var(--p)*6) calc(var(--p)*10);border-radius:99px;white-space:nowrap}
.tape .pb.on{background:var(--ink);color:#fff}
.tape .pb.off{background:var(--coral);color:#fff}
.tape .tm{font:800 calc(var(--p)*15)/1 var(--mono)}
.tape .pl{font:650 calc(var(--p)*12.5)/1.2 var(--sans);opacity:.75}
.tape .k{font-size:calc(var(--p)*16)}
.wide .tape .t b{font-size:calc(var(--p)*17)}
.wide .tape .pl{display:none}

/* 얇은 리본 */
.tapes{gap:calc(var(--p)*8)}
.tape{padding-top:calc(var(--p)*7);padding-bottom:calc(var(--p)*7)}
.tape .d{font-size:calc(var(--p)*28)}
.tape .d small{font-size:calc(var(--p)*13)}
.tape .no{font-size:calc(var(--p)*11.5);padding:calc(var(--p)*5) calc(var(--p)*7)}
.tape .t b{font-size:calc(var(--p)*16)}
.tape .wh{margin-top:calc(var(--p)*4) !important}
.tape .pb{font-size:calc(var(--p)*12);padding:calc(var(--p)*4) calc(var(--p)*9)}
.tape .tm{font-size:calc(var(--p)*13)}
.tape .k{font-size:calc(var(--p)*14)}
.wide .tape .t b{font-size:calc(var(--p)*15)}
/* 탭 안내: 테이프 안 작은 칩 */
.tape .k{display:flex;flex-direction:column;align-items:flex-end;gap:calc(var(--p)*5)}
.tapin{font-style:normal;font:800 calc(var(--p)*9.5)/1 var(--mono);letter-spacing:.06em;background:var(--ink);color:#fff;padding:calc(var(--p)*4) calc(var(--p)*7);border-radius:99px;animation:tapblink 1.4s ease-in-out infinite}
@keyframes tapblink{50%{opacity:.35}}
.static .tapin{display:none}

/* 가로 화면에서만 리본 테이프 크게 */
.wide .tapes{gap:calc(var(--p)*14);padding:calc(var(--p)*36) calc(var(--p)*24) calc(var(--p)*20) 0;align-content:center}
.wide .tape{padding:calc(var(--p)*16) calc(var(--p)*26);gap:calc(var(--p)*18)}
.wide .tape .no{font-size:calc(var(--p)*14);padding:calc(var(--p)*7) calc(var(--p)*9)}
.wide .tape .d{font-size:calc(var(--p)*40)}
.wide .tape .d small{font-size:calc(var(--p)*17)}
.wide .tape .t b{font-size:calc(var(--p)*20)}
.wide .tape .pb{font-size:calc(var(--p)*14);padding:calc(var(--p)*6) calc(var(--p)*11)}
.wide .tape .tm{font-size:calc(var(--p)*16)}
.wide .tape .k{font-size:calc(var(--p)*18)}
.wide .tapin{font-size:calc(var(--p)*11)}
.wide .tape .nx{font-size:calc(var(--p)*13)}

/* 이스터에그 */
.eghint{color:#7E8781;font-size:.86em}
/* 알은 JS가 일러스트 영역 안에서 천천히 굴려 움직임(transform), 안쪽 그림은 통통 튐 */
.egg{position:absolute;z-index:4;left:0;top:0;width:calc(var(--p)*40);padding:0;border:0;background:none;cursor:pointer;will-change:transform}
.egg svg{transform-origin:50% 100%;animation:eggbreath 2.4s ease-in-out infinite}
.egg.walking svg{animation:egghop .55s ease-in-out infinite}
@keyframes eggbreath{50%{transform:scale(1.03,.97)}}
.egg:hover svg,.egg.stop svg{animation:eggwob .6s ease-in-out infinite}
.egg::after{content:"";position:absolute;left:15%;right:15%;bottom:calc(var(--p)*-5);height:calc(var(--p)*5);border-radius:50%;background:rgba(204,255,0,.35)}
.egg.walking::after{animation:eggshadow .55s ease-in-out infinite}
@keyframes egghop{0%,100%{transform:translateY(0) scale(1.05,.95)}50%{transform:translateY(calc(var(--p)*-9)) scale(.97,1.03)}}
@keyframes eggshadow{45%{transform:scaleX(.6);opacity:.4}}
.egg:focus-visible{outline:calc(var(--p)*3) solid var(--coral);outline-offset:calc(var(--p)*4)}
@keyframes eggwob{0%,100%{transform:rotate(0)}30%{transform:rotate(-12deg)}70%{transform:rotate(10deg)}}
.static .egg svg,.static .egg::after{animation:none}
.eggpop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:80;width:min(86%,calc(var(--p)*520));background:var(--paper);color:var(--ink);
  border:calc(var(--p)*3) solid var(--ink);box-shadow:calc(var(--p)*8) calc(var(--p)*8) 0 var(--lime);padding:calc(var(--p)*26) calc(var(--p)*28) calc(var(--p)*24);text-align:center}
.eggpop[hidden]{display:none}
.eg-x{position:absolute;right:calc(var(--p)*12);top:calc(var(--p)*12);width:calc(var(--p)*34);height:calc(var(--p)*34);border:0;border-radius:50%;background:var(--ink);color:#fff;font:800 calc(var(--p)*14)/1 var(--sans);cursor:pointer}
.eg-art{width:calc(var(--p)*70);margin:0 auto}
.eggpop small{display:block;margin-top:calc(var(--p)*12);font:800 calc(var(--p)*11)/1 var(--mono);letter-spacing:.14em;color:#6B5BD6}
.eggpop h3{margin:calc(var(--p)*8) 0 0;font:900 calc(var(--p)*28)/1.2 var(--sans);letter-spacing:-.04em}
.eggpop p{margin:calc(var(--p)*12) 0 0;font:600 calc(var(--p)*14.5)/1.65 var(--sans);letter-spacing:-.02em}
.eggpop p b{font-weight:850;background:var(--lime);padding:0 calc(var(--p)*3)}
.eggpop p em{font-style:normal;opacity:.6}
.slots{display:flex;justify-content:center;gap:calc(var(--p)*12);margin-top:calc(var(--p)*16)}
.slots span{display:flex;flex-direction:column;align-items:center;gap:calc(var(--p)*6);font:800 calc(var(--p)*12)/1 var(--mono)}
.slots i{font-style:normal;width:calc(var(--p)*84);height:calc(var(--p)*40);display:grid;place-items:center;border:calc(var(--p)*2.5) dashed var(--ink);font:900 calc(var(--p)*20)/1 var(--mono);color:#6B5BD6;background:#fff}
.eg-ok{margin-top:calc(var(--p)*18);border:0;background:var(--ink);color:var(--lime);font:900 calc(var(--p)*15)/1 var(--sans);padding:calc(var(--p)*13) calc(var(--p)*22);border-radius:99px;cursor:pointer}
.wide .tape .d{font-size:calc(var(--p)*34)}
.wide .tape .d small{font-size:calc(var(--p)*15)}
.wide .tape .t b{font-size:calc(var(--p)*17);white-space:nowrap}
.wide .tape{gap:calc(var(--p)*14)}
.eggpop .eg-todo{margin-top:calc(var(--p)*14);font:700 calc(var(--p)*12.5)/1.5 var(--mono);color:#6B5BD6}
.eggpop .eg-todo s{text-decoration:none;background:var(--ink);color:var(--lime);padding:0 calc(var(--p)*5);border-radius:calc(var(--p)*4)}
.eggpop .eg-kao{font:800 calc(var(--p)*22)/1 var(--mono);color:var(--ink);letter-spacing:.02em;margin-top:calc(var(--p)*16)}

/* QR 아래 인스타 설명 */
.qr{flex-direction:column;gap:calc(var(--p)*6)}
.qrcap{display:flex;flex-direction:column;align-items:center;gap:calc(var(--p)*2);font:800 calc(var(--p)*13)/1.15 var(--mono);font-style:normal;color:var(--ink);text-align:center}
.qrcap b{font:800 calc(var(--p)*9.5)/1 var(--mono);letter-spacing:.14em;opacity:.7}
.qrcap i{font:700 calc(var(--p)*9.5)/1.25 var(--sans);font-style:normal;opacity:.75;letter-spacing:-.02em}
.qr img{width:calc(var(--p)*80);height:calc(var(--p)*80)}
.wide .qr img{width:calc(var(--p)*62);height:calc(var(--p)*62)}
.wide .qrcap{font-size:calc(var(--p)*11)}

/* 카드 문장: 한 문장씩 줄, 붙어 있어야 하는 말은 떨어지지 않게, 줄 길이는 고르게 */
.eggpop p{word-break:keep-all;text-wrap:balance}
.eggpop .ln{display:block}
.eggpop .ln+.ln{margin-top:calc(var(--p)*4)}
.eggpop .nb{white-space:nowrap}
html:not(.wide) .eggpop{width:min(92%,calc(var(--p)*560));padding-left:calc(var(--p)*20);padding-right:calc(var(--p)*20)}

/* QR 칸: 글씨가 커져도(휴대폰 최소 글자 크기) 칸 안에 들어가게 — QR 그림이 남는 높이에 맞춰 줄어듦 */
.qr{display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;padding:calc(var(--p)*8) calc(var(--p)*6)}
.qr > span:first-child{flex:1 1 0;min-height:0;height:auto;aspect-ratio:1;max-width:100%;display:flex;padding:calc(var(--p)*5)}
.qr img,.wide .qr img{width:100%;height:100%;object-fit:contain}
.qrcap{flex:none;white-space:nowrap}

/* 인스타 라벨: QR 칸 아래 모서리에 걸친 작은 태그 → QR 크기는 그대로, 글씨가 커져도 잘리지 않음 */
.qr{position:relative;overflow:visible}
.qrcap{position:absolute;left:50%;bottom:0;transform:translate(-50%,50%);z-index:6;flex-direction:row;gap:calc(var(--p)*6);align-items:center;
  background:var(--ink);color:#fff;border:calc(var(--p)*2) solid var(--sky);border-radius:99px;padding:calc(var(--p)*6) calc(var(--p)*12);font-size:calc(var(--p)*13)}
.qrcap b{color:var(--lime);opacity:1;font-size:calc(var(--p)*11)}
.wide .qrcap{font-size:calc(var(--p)*11.5)}
.qrcap{left:50%;right:auto;transform:translate(calc(-50% + var(--qx, 0px)),50%)}
.qr{padding-bottom:calc(var(--p)*20)}

/* 소개 문구: 코드 줄처럼 한 줄씩 고정 (줄바꿈 금지) */
.lede{max-width:calc(100% - var(--p)*48)}
.lede .lc{display:block;white-space:nowrap}
</style>
</head>
<body>
<div class="stage">
<article id="poster" aria-label="교사 개발자의 날 2026 포스터">
  <div class="lay">
    <div class="top"><span><b>&gt;_</b> TEACHER_DEV_DAY.md</span><span class="c">// SEOUL 2026</span></div>
    <div class="art">
      <div class="syms" aria-hidden="true"></div>
      <span class="say">hello, teacher!</span>
      <div class="prom" role="img" aria-label="2D 프롬이"><div class="bw"></div></div>
      <p class="lede"><span class="lc"># 교실의 문제를 <b>코드로</b> 바꾸는 선생님들</span><span class="lc">## <b>매달 마지막 화요일 저녁</b> 모입니다</span><span class="lc eghint">// FIXME: 알이 가만히 있지를 않음. 잡아 주세요</span></p>
      <button class="egg" type="button" aria-label="숨은 이스터에그"></button>
    </div>
    <div class="tapes"></div>
    <div class="blocks">
      <span class="label">누구나 == 개발자</span>
      <div class="bk b1">교사</div><div class="bk b2">개발자</div>
      <div class="bk b3">의 날</div>
      <div class="yr" aria-label="2026"><i>2</i><i>0</i><i>2</i><i>6</i></div>
      <a class="qr" target="_blank" rel="noopener" aria-label="인스타그램 @sendevkorea"><span><img src="shared/qr.svg" alt="인스타그램 @sendevkorea QR 코드"></span><em class="qrcap"><b>IG</b>@sendevkorea</em></a>
    </div>
    <div class="foot"><span>주최 <b class="h1"></b> · 기획 <b class="h2"></b></span><span class="apply"></span></div>
  </div>
</article>
</div>
<div class="ctrl"><button type="button" id="replay">↻ 처음부터</button></div>
<script>
const { STATIC, fi, F } = ENV, S = POSTER.sessions;
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const poster = $('#poster');
$('.h1').textContent = POSTER.host; $('.h2').textContent = POSTER.team;
$('.qr').href = POSTER.insta.url;
// 소개 문구 줄이 칸보다 길면(휴대폰 글씨 확대) 줄바꿈 대신 그 줄 글씨만 살짝 줄임
function fitLede() {
  const lede = $('.lede'), max = lede.parentElement.clientWidth - 2 * lede.offsetLeft;
  $$('.lede .lc').forEach(l => { l.style.fontSize = ''; const w = l.scrollWidth; if (w > max) l.style.fontSize = (parseFloat(getComputedStyle(l).fontSize) * max / w * .98) + 'px'; });
}
addEventListener('resize', fitLede); document.fonts.ready.then(fitLede); fitLede();
// 인스타 라벨은 QR 가운데. 글씨가 커져 포스터 밖으로 나가면 그만큼만 안쪽으로
const qrcap = $('.qrcap');
function fitCap() {
  qrcap.style.setProperty('--qx', '0px');
  const pr = poster.getBoundingClientRect(), c = qrcap.getBoundingClientRect(), m = 6;
  const over = c.right - (pr.right - m), under = (pr.left + m) - c.left;
  qrcap.style.setProperty('--qx', over > 0 ? -over + 'px' : under > 0 ? under + 'px' : '0px');
}
addEventListener('resize', fitCap); document.fonts.ready.then(fitCap); fitCap();
$('.apply').innerHTML = '신청·자료는 sendev.kr · 소식과 후기는 인스타그램 @sendevkorea' + (F.apply ? '' : ENV.pendTag);

// 2D 프롬이
const bw = $('.prom .bw');
const PF = ['happy', 'wink', 'happy', 'idle'];
bw.innerHTML = KIT.flat({ face: 'happy', line: '#fff' });

// 픽셀 코딩 기호
const C = { B: '#4FC3FF' };
const G = {
  hash: ['.B..B.', 'BBBBBB', '.B..B.', '.B..B.', 'BBBBBB', '.B..B.'],
  neq: ['W..LLLL', 'W......', 'W..LLLL', 'W......', '.......', 'W......'],
  semi: ['.VV', '.VV', '...', '.VV', '.V.', 'V..'],
  brace: ['..VV...VV..', '.V.......V.', '.V.......V.', 'V.........V', '.V.......V.', '.V.......V.', '..VV...VV..'],
  quote: ['WW.WW', 'WW.WW', '.W..W', 'W..W.'],
  prompt: ['L.....', '.L....', '..L...', '.L....', 'L..LLL'],
  star: ['..C..', 'C.C.C', '.CCC.', 'C.C.C', '..C..'],
  tag: ['..L.....L..L..', '.L.....L....L.', 'L.....L......L', '.L...L......L.', '..L.L......L..'],
  bracket: ['VV..VV', 'V....V', 'V....V', 'V....V', 'VV..VV'],
};
// [기호, 왼쪽%, 위%, 너비(u), 깊이]
const PLACE = [['neq', 6, 8, 96, 1.2], ['hash', 70, 6, 78, .7], ['quote', 84, 38, 54, 1.4], ['semi', 20, 52, 30, .9], ['brace', 64, 62, 120, 1.1],
  ['prompt', 8, 40, 60, .6], ['star', 44, 8, 42, 1.5], ['tag', 30, 24, 96, .5], ['bracket', 86, 70, 46, 1.3], ['star', 4, 72, 30, .8]];
$('.syms').innerHTML = PLACE.map(([g, x, y, w, d], i) =>
  `<span class="sym" data-d="${d}" style="left:${x}%;top:${y}%;width:calc(var(--p)*${w})">${KIT.pix(G[g], { colors: C })}</span>`).join('');
// 매번 0도에서 한 바퀴 새로 돌기 (도는 중이면 다시 시작)
const spinSym = s => {
  s.getAnimations().forEach(a => a.cancel());
  s.animate([{ transform: 'rotate(0) scale(1)' }, { transform: 'rotate(380deg) scale(1.15)', offset: .7 }, { transform: 'rotate(360deg) scale(1)' }], { duration: 650, easing: 'cubic-bezier(.3,.9,.4,1)' });
};
$$('.sym').forEach(s => s.addEventListener('click', e => { e.stopPropagation(); spinSym(s); }));
// 누르지 않아도 1.5~2.5초마다 기호 하나만 무작위로 빙글 (같은 기호 연속 X)
if (ENV.ANIMATE) {
  let lastSym = null;
  (function autoSpin() {
    setTimeout(() => {
      const all = $$('.sym').filter(s => s !== lastSym);
      lastSym = all[Math.random() * all.length | 0];
      if (lastSym && !document.hidden) spinSym(lastSym);
      autoSpin();
    }, 1500 + Math.random() * 1000);
  })();
}
// 기호 따라오기: 한 프레임에 한 번만 계산
const SYMS = $$('.sym');
let pm = null, pmRaf = 0;
// 기호가 손가락·마우스를 따라 살짝 움직임 (입장 화면·버튼 위 움직임은 무시)
if (!STATIC) poster.addEventListener('pointermove', e => {
  if (e.target.closest('.story,.intro,.page,button')) return;
  pm = e; if (pmRaf) return;
  pmRaf = requestAnimationFrame(() => {
    pmRaf = 0; const r = poster.getBoundingClientRect(), dx = (pm.clientX - r.left) / r.width - .5, dy = (pm.clientY - r.top) / r.height - .5;
    SYMS.forEach(s => { s.style.translate = `${-dx * 30 * s.dataset.d}px ${-dy * 30 * s.dataset.d}px`; });
  });
});

// 제자리로: 마우스가 나가거나, 휴대폰에서 손을 떼면 부드럽게 가운데로
const symHome = () => SYMS.forEach(s => { s.style.translate = ''; });
if (!STATIC) {
  poster.addEventListener('pointerleave', symHome);
  poster.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') symHome(); });
  poster.addEventListener('pointercancel', symHome);
}

// 리본 테이프
const NAMES = ['경험을 잇는 날', 'debug 실패의 날 × 외국인 개발자', '구출의 날 · 구해줘요, 교사 개발자!'];
const PL = [['on', '온라인', '만들기 전과 후, 우리 교실 이야기'], ['off', '현장 집합', '서울시교육청(예정) · 생중계'], ['on', '온라인', '연말 특집 보이는 라디오']];
const KAO = ['{^_^}', '(;_;)', '\\(^o^)/'];
// 상세 페이지 프롬이: 1회 헤드셋(보이는 라디오) · 2회 버그 · 3회 히어로 망토
const FACE = ['wink', 'worry', 'happy'], ACC = ['headset', 'bug', 'cape'];
$('.tapes').innerHTML = S.map((s, i) => `<button class="tape" type="button" data-i="${i}" aria-label="${s.mo}월 ${s.dd}일 ${NAMES[i]} 자세히 보기">
  ${i === fi ? '<span class="nx">NEXT!</span>' : ''}
  <span class="no">#0${i + 1}</span>
  <span class="d">${s.mo}월 ${s.dd}일<small>(${s.dow})</small></span>
  <span class="t"><b>${NAMES[i]}</b><span class="wh"><i class="pb ${PL[i][0]}">${PL[i][0] === 'on' ? '◉ ' : '⚑ '}${PL[i][1]}</i><span class="tm">${s.time}</span><span class="pl">${PL[i][2]}</span></span></span>
  <span class="k">${KAO[i]}<i class="tapin" aria-hidden="true">TAP</i></span></button>`).join('');

// 프롬이: 누르면 표정 바뀌고 말풍선 변경
const SAY = ['hello, teacher!', 'console.log("반가워요")', 'if (교실) 개발자 = true;', '>_ 접속 완료!'];
let k = 0;
$('.prom').addEventListener('click', e => {
  e.stopPropagation(); k++;
  bw.innerHTML = KIT.flat({ face: PF[k % PF.length], line: '#fff' });
  $('.say').textContent = SAY[k % SAY.length];
  KIT.burst(poster, 397, 330, { n: 16, colors: ['#CCFF00', '#CFC4FF', '#4FC3FF', '#FF5C39'] });
});

// 한 번 눌러 보면 탭 안내는 사라짐
// ── 이스터에그: 기호들 사이에 숨은 픽셀 알. 누르면 깨지면서 시즌 패스 안내
const egg = $('.egg');
const EGG = ['...KKKK...', '..KWWWWK..', '.KWWLWWWK.', '.KWLLLWWK.', 'KWWWLWWWWK', 'KWWWWWVWWK', 'KWVWWWVVWK', 'KWVVWWWWWK', '.KWWWWWWK.', '..KKKKKK..'];
const CRACK = ['...KKKK...', '..KWWWWK..', '.KWWLWWWK.', '.KWLLLWWK.', 'KKWKWKWKKK', 'K.K.K.K..K', 'KWVWWWVVWK', 'KWVVWWWWWK', '.KWWWWWWK.', '..KKKKKK..'];
const eggPix = rows => KIT.pix(rows, { colors: { K: '#0E1311', W: '#FFFFFF', L: '#CCFF00', V: '#CFC4FF' } });
egg.innerHTML = eggPix(EGG);
poster.insertAdjacentHTML('beforeend', `<section class="eggpop" role="dialog" aria-modal="true" aria-labelledby="eggT" hidden>
  <button class="eg-x" type="button" aria-label="닫기">✕</button>
  <div class="eg-art">${eggPix(CRACK)}</div>
  <small>[x] 이스터에그 잡기 완료</small>
  <h3 id="eggT">잡았다! 이스터에그</h3>
  <p><span class="ln">이스터에그는 개발자가 <span class="nb">몰래 숨겨 두는</span> <span class="nb"><b>작은 선물</b>이에요.</span></span><span class="ln">방송 화면에도 <span class="nb"><b>회차마다 단어가 하나씩</b></span> <span class="nb">숨어 있어요.</span></span></p>
  <div class="slots"><span><i>?</i>10월</span><span><i>?</i>11월</span><span><i>?</i>12월</span></div>
  <p><span class="ln">세 단어를 모으면 <span class="nb"><b>선언문의 마지막 문장</b>이</span> <span class="nb">완성돼요.</span></span><span class="ln">찾은 단어는 <span class="nb">sendev.kr 시즌 패스에</span> <span class="nb">입력! <em>(선택 참여)</em></span></span></p>
  <p class="eg-todo eg-kao" aria-label="신나는 표정">\\(^ㅂ^)/ ✧</p>
  <button class="eg-ok" type="button">이스터에그 찾으러 가기 ▶</button>
</section>`);
const pop = $('.eggpop');
const closeEgg = () => { pop.hidden = true; eg.hold = false; egg.classList.remove('stop'); egg.innerHTML = eggPix(EGG); egg.focus({ preventScroll: true }); };
egg.addEventListener('click', e => {
  e.stopPropagation();
  egg.innerHTML = eggPix(CRACK);
  egg.classList.add('stop');
  const r = egg.getBoundingClientRect(), pr = poster.getBoundingClientRect(), P = KIT.unit(poster);
  KIT.burst(poster, (r.left - pr.left + r.width / 2) / P, (r.top - pr.top) / P, { n: 18, colors: ['#CCFF00', '#CFC4FF', '#FFFFFF', '#4FC3FF'] });
  setTimeout(() => { pop.hidden = false; pop.animate([{ opacity: 0, transform: 'translate(-50%,-46%) scale(.9)' }, { opacity: 1, transform: 'translate(-50%,-50%)' }], { duration: 320, easing: 'cubic-bezier(.3,1.4,.5,1)' }); $('.eg-ok').focus({ preventScroll: true }); }, 300);
});
pop.addEventListener('click', e => e.stopPropagation());

// 알이 빈 공간을 산책: 목적지를 정해 천천히 출발·감속해 도착 → 잠깐 쉬며 두리번 → 다음 목적지
//   세로판: 소개 문구(# 교실의…) 오른쪽 빈칸 / 가로판: 리본 테이프 위 빈칸
poster.appendChild(egg);
const eg = { x: 0, y: 0, vx: 0, vy: 0, tx: 0, ty: 0, rest: 0, face: 1, hold: false, last: 0 };
let Z = { x0: 0, y0: 0, x1: 0, y1: 0 };
function eggZone() {
  const pr = poster.getBoundingClientRect(), P = KIT.unit(poster), ew = egg.offsetWidth, eh = egg.offsetHeight;
  const rel = el => { const r = el.getBoundingClientRect(); return { l: r.left - pr.left, r: r.right - pr.left, t: r.top - pr.top, b: r.bottom - pr.top }; };
  const tape = rel($('.tape'));
  if (document.documentElement.classList.contains('wide')) {
    const blocks = rel($('.blocks')), tapes = rel($('.tapes'));
    Z = { x0: tapes.l + 30 * P, x1: pr.width - ew - 40 * P, y0: blocks.b + 56 * P, y1: tape.t - eh - 40 * P };
  } else {
    const lede = rel($('.lede'));
    Z = { x0: lede.r + 24 * P, x1: pr.width - ew - 110 * P, y0: lede.t - 4 * P, y1: tape.t - eh - 12 * P };
  }
  if (Z.x1 < Z.x0 + 20) Z.x1 = Z.x0 + 20;
  if (Z.y1 < Z.y0 + 10) Z.y1 = Z.y0 + 10;
}
function eggPick() {
  eggZone();
  const P = KIT.unit(poster), far = Math.min(120 * P, (Z.x1 - Z.x0) * .4);
  // 너무 가까운 곳은 피해서 확실히 걸어가게
  for (let k = 0; k < 8; k++) {
    eg.tx = Z.x0 + Math.random() * (Z.x1 - Z.x0); eg.ty = Z.y0 + Math.random() * (Z.y1 - Z.y0);
    if (Math.hypot(eg.tx - eg.x, eg.ty - eg.y) > far) break;
  }
}
function eggStart() {
  eggZone();
  eg.x = (Z.x0 + Z.x1) / 2; eg.y = (Z.y0 + Z.y1) / 2; eg.vx = eg.vy = 0; eg.rest = 0.6; eggPick();
  egg.style.transform = `translate(${eg.x}px, ${eg.y}px)`;
}
function eggStep(t) {
  const dt = Math.min(.05, (t - (eg.last || t)) / 1000); eg.last = t;
  if (!eg.hold && pop.hidden) {
    const P = KIT.unit(poster), speed = 34 * P;
    if (eg.rest > 0) {
      eg.rest -= dt; eg.vx *= .85; eg.vy *= .85;
      // 쉬는 동안 가끔 반대쪽을 돌아봄
      if (Math.random() < dt * .8) eg.face = -eg.face;
      if (eg.rest <= 0) eggPick();
    } else {
      const dx = eg.tx - eg.x, dy = eg.ty - eg.y, dist = Math.hypot(dx, dy);
      if (dist < 4 * P) { eg.rest = 1 + Math.random() * 2; }
      else {
        // 출발은 천천히, 도착 전 감속, 방향은 부드럽게 꺾음
        const want = speed * Math.min(1, dist / (70 * P));
        const k = 1 - Math.pow(.02, dt);
        eg.vx += (dx / dist * want - eg.vx) * k;
        eg.vy += (dy / dist * want - eg.vy) * k;
        if (Math.abs(eg.vx) > 3 * P) eg.face = eg.vx < 0 ? -1 : 1;
      }
    }
    eg.x = Math.max(Z.x0, Math.min(Z.x1, eg.x + eg.vx * dt));
    eg.y = Math.max(Z.y0, Math.min(Z.y1, eg.y + eg.vy * dt));
    egg.classList.toggle('walking', Math.hypot(eg.vx, eg.vy) > 6 * P);
    egg.style.transform = `translate(${eg.x}px, ${eg.y}px) scaleX(${eg.face})`;
  }
  requestAnimationFrame(eggStep);
}
eggStart();
document.fonts.ready.then(eggStart); // 글꼴이 다 불러와진 뒤 빈칸 위치 다시 계산
if (ENV.ANIMATE) {
  requestAnimationFrame(eggStep);
  setTimeout(eggStart, 1600); // 등장 연출이 끝난 뒤 위치 다시 계산
  egg.addEventListener('pointerenter', () => { eg.hold = true; egg.classList.add('stop'); });
  egg.addEventListener('pointerleave', () => { eg.hold = false; if (pop.hidden) egg.classList.remove('stop'); });
  addEventListener('resize', eggStart);
}
$('.eg-x').addEventListener('click', closeEgg);
$('.eg-ok').addEventListener('click', closeEgg);
addEventListener('keydown', e => { if (e.key === 'Escape' && !pop.hidden) closeEgg(); });

// ?tt 또는 #tt 이면 상세 페이지에 분 단위 시간표 표시
const TT = new URLSearchParams(location.search || location.hash.slice(1)).has('tt');
CORE.init({
  intro: 'story',
  timetable: TT,
  dark: true,
  cards: '.tape',
  face: i => KIT.flat({ face: FACE[i], acc: ACC[i], line: '#fff' }),
  dots: { color: '#CCFF00', alpha: .04, hot: .45 },
  drip: ['#CCFF00', '#CFC4FF', '#4FC3FF'],
  burst: ['#CCFF00', '#CFC4FF', '#4FC3FF', '#FF5C39'],
  reveal() {
    symHome();
    // 제목 블록 → 기호·프롬이 → 테이프 순서로 빠르게 (약 1초)
    KIT.pop([$('.top')]);
    $$('.bk,.yr,.qr').forEach((b, i) => b.animate([{ transform: 'translateY(-100%)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 380, delay: i * 50, easing: 'cubic-bezier(.2,.9,.3,1.1)', fill: 'backwards' }));
    $$('.sym').forEach((s, i) => s.animate([{ transform: 'scale(0) rotate(-90deg)', opacity: 0 }, { transform: 'scale(1.15)', opacity: 1, offset: .7 }, { transform: 'none', opacity: 1 }],
      { duration: 340, delay: 120 + i * 25, easing: 'cubic-bezier(.3,1.4,.5,1)', fill: 'backwards' }));
    KIT.drop([$('.prom')], { delay: 150, height: 300 });
    KIT.pop([$('.label'), $('.say'), $('.lede')], { delay: 350, stagger: 60 });
    $$('.tape').forEach((t, i) => t.animate([{ transform: `translateX(${i % 2 ? '' : '-'}110%)` }, { transform: getComputedStyle(t).transform }], { duration: 420, delay: 300 + i * 90, easing: 'cubic-bezier(.2,.9,.3,1.05)', fill: 'backwards' }));
  },
});
</script>
</body>
</html>
