<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교사 개발자의 날 2026</title>
<meta name="description" content="프롬이가 말을 걸어요. 10.27 · 11.24 · 12.15 교사 개발자의 날">
<link rel="stylesheet" href="../shared/fonts.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap">
<link rel="stylesheet" href="../shared/base.css">
<script src="../shared/data.js"></script>
<script src="../shared/kit.js"></script>
<style>
/* 시안 G · 프롬이 메신저: 대화로 행사를 소개 */
#poster{background:var(--lime)}
.u{position:absolute}
.head{left:calc(var(--p)*48);top:calc(var(--p)*40);right:calc(var(--p)*48)}
.head .k{font:400 calc(var(--p)*15)/1 var(--pixel)}
.head h1{margin:calc(var(--p)*12) 0 0;font-size:calc(var(--p)*84);line-height:1;font-weight:900;letter-spacing:-.065em}
.head .side{position:absolute;right:0;top:calc(var(--p)*2);font:700 calc(var(--p)*12)/1 var(--mono);letter-spacing:.1em}

.chat{left:calc(var(--p)*48);right:calc(var(--p)*48);top:calc(var(--p)*200);bottom:calc(var(--p)*62);background:var(--paper);border:calc(var(--p)*2.5) solid var(--ink);
  border-radius:calc(var(--p)*30);box-shadow:calc(var(--p)*8) calc(var(--p)*8) 0 var(--ink);display:flex;flex-direction:column;overflow:hidden}
.ch-top{display:flex;align-items:center;gap:calc(var(--p)*12);padding:calc(var(--p)*16) calc(var(--p)*22);border-bottom:calc(var(--p)*2) solid var(--ink);background:#fff}
.ava{width:calc(var(--p)*48);height:calc(var(--p)*48);border-radius:50%;background:var(--lilac);display:grid;place-items:center;border:calc(var(--p)*2) solid var(--ink);flex:none}
.ava .w{width:72%}
.ch-top b{font-size:calc(var(--p)*18);font-weight:850;letter-spacing:-.02em}
.ch-top b span{font:800 calc(var(--p)*13)/1 var(--mono);margin-left:calc(var(--p)*4)}
.ch-top small{display:flex;align-items:center;gap:calc(var(--p)*6);font:400 calc(var(--p)*11.5)/1 var(--pixel);margin-top:calc(var(--p)*5);color:#4B544F}
.ch-top small::before{content:"";width:calc(var(--p)*7);height:calc(var(--p)*7);border-radius:50%;background:#2BB24C}
.ch-top .r{margin-left:auto;font:800 calc(var(--p)*12)/1 var(--mono);background:var(--ink);color:var(--lime);padding:calc(var(--p)*8) calc(var(--p)*12);border-radius:99px}

.msgs{flex:1;padding:calc(var(--p)*18) calc(var(--p)*22) calc(var(--p)*8);display:flex;flex-direction:column;gap:calc(var(--p)*9);overflow:hidden}
.row{display:flex;gap:calc(var(--p)*9);align-items:flex-end}
.row.me{justify-content:flex-end}
.row .ava{width:calc(var(--p)*36);height:calc(var(--p)*36);border-width:calc(var(--p)*1.8)}
.row .sp{width:calc(var(--p)*36);flex:none}
.bub{max-width:76%;font-size:calc(var(--p)*16);line-height:1.5;font-weight:600;letter-spacing:-.02em;padding:calc(var(--p)*10) calc(var(--p)*15);
  background:#fff;border:calc(var(--p)*2) solid var(--ink);border-radius:calc(var(--p)*20) calc(var(--p)*20) calc(var(--p)*20) calc(var(--p)*6)}
.me .bub{background:var(--ink);color:#fff;border-radius:calc(var(--p)*20) calc(var(--p)*20) calc(var(--p)*6) calc(var(--p)*20)}
.bub em{font-style:normal;background:var(--lime);color:var(--ink);padding:0 calc(var(--p)*4)}
.time{font:400 calc(var(--p)*10)/1 var(--pixel);color:#7A837E;margin-bottom:calc(var(--p)*3)}

.ev{padding:0;overflow:hidden;width:76%}
.ev .eh{background:var(--lilac);padding:calc(var(--p)*12) calc(var(--p)*15);border-bottom:calc(var(--p)*2) solid var(--ink)}
.ev .eh small{font:400 calc(var(--p)*11)/1 var(--pixel)}
.ev .eh strong{display:block;font-size:calc(var(--p)*21);font-weight:900;letter-spacing:-.04em;margin-top:calc(var(--p)*5)}
.ev ol{list-style:none;margin:0;padding:calc(var(--p)*4) calc(var(--p)*15)}
.ev li{display:grid;grid-template-columns:calc(var(--p)*78) 1fr auto;align-items:center;padding:calc(var(--p)*8) 0;border-top:1px dashed rgba(14,19,17,.25);font-size:calc(var(--p)*13.5)}
.ev li:first-child{border-top:0}
.ev li b{font:800 calc(var(--p)*17)/1 var(--mono);letter-spacing:-.04em}
.ev li span small{display:block;font-size:calc(var(--p)*11);color:#6A736E;font-weight:550;margin-top:calc(var(--p)*2)}
.ev li i{font:400 calc(var(--p)*10.5)/1 var(--pixel);font-style:normal;padding:calc(var(--p)*5) calc(var(--p)*7);border-radius:99px;border:1px solid var(--ink)}
.ev li.next i{background:var(--coral);border-color:var(--coral);color:#fff}
.ev li.next b{justify-self:start;background:var(--lime);padding:0 calc(var(--p)*3)}

.qrb{display:flex;gap:calc(var(--p)*14);align-items:center;padding:calc(var(--p)*12)}
.qrb a{display:block;width:calc(var(--p)*96);height:calc(var(--p)*96);padding:calc(var(--p)*6);background:var(--lime);border-radius:calc(var(--p)*10);flex:none}
.qrb img{display:block;width:100%;height:100%}
.qrb div{font-size:calc(var(--p)*13.5);line-height:1.6}
.qrb b{font:800 calc(var(--p)*15)/1 var(--mono)}

.typing{display:inline-flex;gap:calc(var(--p)*5);padding:calc(var(--p)*14) calc(var(--p)*16)}
.typing i{width:calc(var(--p)*8);height:calc(var(--p)*8);border-radius:50%;background:var(--ink);animation:bob .9s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}

.replies{display:flex;gap:calc(var(--p)*8);padding:calc(var(--p)*12) calc(var(--p)*20) calc(var(--p)*16);border-top:calc(var(--p)*2) solid var(--ink);background:#fff}
.replies button{font:700 calc(var(--p)*13.5)/1 var(--sans);padding:calc(var(--p)*10) calc(var(--p)*14);border-radius:99px;border:calc(var(--p)*2) solid var(--ink);background:var(--paper);cursor:pointer;color:var(--ink)}
.replies button:hover{background:var(--lime)}
.replies .send{margin-left:auto;width:calc(var(--p)*40);height:calc(var(--p)*40);border-radius:50%;background:var(--ink);display:grid;place-items:center;color:var(--lime);font:800 calc(var(--p)*15)/1 var(--mono)}

.peek{right:calc(var(--p)*30);top:calc(var(--p)*96);width:calc(var(--p)*130);transform:rotate(8deg);z-index:5}
.foot{left:calc(var(--p)*48);right:calc(var(--p)*48);bottom:calc(var(--p)*22);display:flex;justify-content:space-between;font-size:calc(var(--p)*11.5);font-weight:600}
.foot b{font-weight:800}
.foot .mono{font:800 calc(var(--p)*11)/1 var(--mono);letter-spacing:.08em}
</style>
</head>
<body>
<div class="stage">
<article id="poster" aria-label="교사 개발자의 날 2026 포스터">
  <div class="u head">
    <div class="k">▶ 새 메시지 1개 · 프롬이</div>
    <h1>교사 개발자의 날</h1>
    <span class="side">2026 · SEASON 1</span>
  </div>
  <div class="u peek outline"></div>

  <section class="u chat" aria-label="프롬이와의 대화">
    <div class="ch-top">
      <span class="ava"><span class="w"></span></span>
      <div><b>프롬이<span>&gt;_</span></b><small>교사 개발자를 기다리는 중</small></div>
      <span class="r"></span>
    </div>
    <div class="msgs" aria-live="polite"></div>
    <div class="replies">
      <button type="button" data-q="when">언제 해요?</button>
      <button type="button" data-q="what">뭐 해요?</button>
      <button type="button" data-q="who">저도 돼요?</button>
      <span class="send" aria-hidden="true">↑</span>
    </div>
  </section>

  <div class="u foot"><span>주최 <b class="h1"></b> · 기획 <b class="h2"></b></span><span class="mono">TEACHER DEV DAY</span></div>
</article>
</div>
<div class="ctrl"><button type="button" id="replay">↻ 다시 보기</button></div>

<script>
const { STATIC, ANIMATE, fi, F, dday, pendTag } = ENV;
const S = POSTER.sessions;
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const poster = $('#poster');
$('.h1').textContent = POSTER.host; $('.h2').textContent = POSTER.team;
$('.ch-top .r').textContent = STATIC ? `NEXT ${F.mmdd}` : `${dday} · ${F.mmdd}`;
$('.ava .w').innerHTML = KIT.sprite('idle');
const peek = $('.peek'); peek.innerHTML = KIT.sprite('happy'); KIT.alive(peek, 'happy');

const ava = () => `<span class="ava"><span class="w">${KIT.sprite('idle')}</span></span>`;
const P = (h, first) => `<div class="row">${first ? ava() : '<span class="sp"></span>'}<div class="bub">${h}</div></div>`;
const ME = h => `<div class="row me"><span class="time">오후 4:30</span><div class="bub">${h}</div></div>`;
const EVENT = `<div class="row"><span class="sp"></span><div class="bub ev">
  <div class="eh"><small>📅 초대장 · 2026</small><strong>교사 개발자의 날</strong></div>
  <ol>${S.map((s, i) => `<li class="${i === fi ? 'next' : ''}"><b>${s.mmdd}</b><span>${s.short}<small>${s.format}</small></span><i>${i === fi ? 'NEXT' : s.step}</i></li>`).join('')}</ol></div></div>`;
const QR = `<div class="row"><span class="sp"></span><div class="bub qrb">
  <a href="${POSTER.cta.url}" target="_blank" rel="noopener"><img src="../shared/qr.svg" alt="QR 코드"></a>
  <div>질문이랑 자료는 여기 다 있어요!<br><b>${POSTER.cta.label}</b><br>${F.mmdd} ${F.time ?? '시간 추후 공지'}${F.time ? '' : pendTag}</div></div></div>`;

const SCRIPT = [
  P('선생님! 교실에서 귀찮은 일, 하나쯤 있죠?', true),
  ME('자리 바꾸기… 매번 너무 오래 걸려요'),
  P('그거 <em>코드로</em> 바꿀 수 있어요! 같이 해 봐요', true),
  EVENT,
  ME('저 코딩 하나도 모르는데요?'),
  P('듣기만 해도 괜찮아요. 입문형·성장형·도전형, 모두 개발자예요 ✓', true),
  QR,
];
const ANSWER = {
  when: ['언제 해요?', `${S.map(s => `<b>${s.mmdd}</b>(${s.dow}) ${s.step}`).join(' · ')}! 다음은 <em>${F.mmdd}</em>이에요.`],
  what: ['뭐 해요?', `${F.step} 회차에는 ${F.main}. ${F.join}!`],
  who: ['저도 돼요?', '물론이죠! 코딩 몰라도, 듣기만 해도 OK. 오시면 스티커도 드려요 ✓'],
};

const box = $('.msgs');
const typing = () => `<div class="row tp">${ava()}<div class="bub typing"><i></i><i></i><i></i></div></div>`;
async function say(html, isMe) {
  if (!isMe && ANIMATE) { box.insertAdjacentHTML('beforeend', typing()); await KIT.wait(650); box.querySelector('.tp')?.remove(); }
  box.insertAdjacentHTML('beforeend', html);
  const el = box.lastElementChild;
  if (ANIMATE) el.animate([{ transform: 'translateY(16px) scale(.96)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 300, easing: 'cubic-bezier(.3,1.4,.5,1)' });
  while (box.scrollHeight > box.clientHeight + 2 && box.children.length > 1) box.firstElementChild.remove();
}
let run = 0;
async function play() {
  const my = ++run;
  box.innerHTML = '';
  if (!ANIMATE) { box.innerHTML = SCRIPT.join(''); return; }
  KIT.codeRain(poster, { duration: 1700, colors: ['#0E1311', '#6B5BD6'], bg: '#CCFF00', density: 1.3 });
  KIT.pop([$('.head')], { delay: 900 });
  $('.chat').animate([{ transform: 'translateY(110%)' }, { transform: 'none' }], { duration: 650, delay: 1300, easing: 'cubic-bezier(.2,.9,.3,1.1)', fill: 'backwards' });
  KIT.drop([peek], { delay: 1700, height: 400 });
  await KIT.wait(2000);
  for (const [i, m] of SCRIPT.entries()) {
    if (my !== run) return;
    await say(m, m.includes('row me'));
    await KIT.wait(i === 3 ? 900 : 500);
  }
  KIT.burst(poster, 640, 180, { n: 20 });
}
$$('.replies button').forEach(b => b.addEventListener('click', async () => {
  run++;
  const [q, a] = ANSWER[b.dataset.q];
  await say(ME(q), true);
  await say(P(a, true));
}));
play();
$('#replay').addEventListener('click', play);
</script>
</body>
</html>
